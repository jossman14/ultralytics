# YOLOv8-Hematology: Specialized model for blood smear analysis
# Optimized for detecting and classifying blood cells, parasites, and abnormal cells
# 
# Key Features:
#   - SPDConv: Space-to-Depth Conv preserves fine details (parasites, platelets)
#   - C2fMSA: Multi-Scale Attention for morphological discrimination
#   - GAM_Attention: Global channel+spatial attention for context
#
# Applications:
#   - Malaria parasite detection (ring stage, trophozoites, gametocytes)
#   - Leukemia classification (blast cell identification)
#   - Complete blood count (RBC, WBC, platelet counting)
#   - Morphological abnormality detection
#
# References:
#   - SSW-YOLO: SPD-Conv for microscopy
#   - MS-YOLO: Multi-scale approach for varied cell sizes
#   - YOLO11: C2PSA attention mechanism

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n-hematology
  s: [0.33, 0.50, 1024] # YOLOv8s-hematology  
  m: [0.67, 0.75, 768]  # YOLOv8m-hematology
  l: [1.00, 1.00, 512]  # YOLOv8l-hematology
  x: [1.00, 1.25, 512]  # YOLOv8x-hematology

# YOLOv8-Hematology backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2 (stem layer)
  - [-1, 1, SPDConv, [128]]        # 1-P2/4 (preserve fine details)
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, SPDConv, [256]]        # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SPDConv, [512]]        # 5-P4/16
  - [-1, 6, C2fMSA, [512, True]]   # 6-Multi-scale attention for medium cells
  - [-1, 1, SPDConv, [1024]]       # 7-P5/32
  - [-1, 3, C2fMSA, [1024, True]]  # 8-Multi-scale attention for large cells
  - [-1, 1, GAM_Attention, []]     # 9-Global attention for context
  - [-1, 1, SPPF, [1024, 5]]       # 10

# YOLOv8-Hematology head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]      # cat backbone P4
  - [-1, 3, C2fMSA, [512]]         # 13-attention for medium objects

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # cat backbone P3
  - [-1, 3, C2f, [256]]            # 16 (P3/8-small cells: platelets, parasites)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]     # cat head P4
  - [-1, 3, C2fMSA, [512]]         # 19 (P4/16-medium cells: RBC, lymphocytes)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]     # cat head P5
  - [-1, 3, C2f, [1024]]           # 22 (P5/32-large cells: monocytes, WBC)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
