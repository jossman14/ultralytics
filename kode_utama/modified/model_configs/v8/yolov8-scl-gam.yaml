# YOLOv8s-SCL-GAM: SCL-YOLO with Global Attention Mechanism
# S = StarNet backbone (C2fStar)
# C = CAPFFN neck (PCE, FBM, CFCGLU) + GAM_Attention
# L = LEDHead (Lightweight Efficient Detection Head)
# Reference: SCL-YOLO paper + GAM attention for enhanced feature representation

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# StarNet backbone with C2fStar blocks and GAM attention
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2fStar, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2fStar, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2fStar, [512, True]]
  - [-1, 1, GAM_Attention, []] # 7-GAM at P4
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 3, C2fStar, [1024, True]]
  - [-1, 1, GAM_Attention, []] # 10-GAM at P5
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 1, PCE, [1024]] # 12 - Pyramid Context Extraction

# CAPFFN neck with FBM, CFCGLU, GAM + LEDHead
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4 (after GAM)
  - [-1, 1, FBM, [512]] # 15 - FuseBlockMulti
  - [-1, 3, CFCGLU, [512]] # 16 - CFCGLU block

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, FBM, [256]] # 19 - FuseBlockMulti
  - [-1, 3, CFCGLU, [256]] # 20 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P4
  - [-1, 3, CFCGLU, [512]] # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P5
  - [-1, 3, CFCGLU, [1024]] # 26 (P5/32-large)

  - [[20, 23, 26], 1, LEDHead, [nc]] # LEDHead(P3, P4, P5)
