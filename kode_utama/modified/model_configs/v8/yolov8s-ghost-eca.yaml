# YOLOv8s-Ghost-ECA: Ghost backbone with Efficient Channel Attention
# Extremely lightweight attention mechanism (~0.01M extra params)
# ECA uses 1D convolution for local cross-channel interaction
# Target: ~6M params with attention-enhanced features

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Ghost backbone with ECA attention
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, GhostConv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C3Ghost, [128, True]]
  - [-1, 1, GhostConv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C3Ghost, [256, True]]
  - [-1, 1, ECA, []] # 5 - Efficient Channel Attention after P3
  - [-1, 1, GhostConv, [512, 3, 2]] # 6-P4/16
  - [-1, 6, C3Ghost, [512, True]]
  - [-1, 1, ECA, []] # 8 - Efficient Channel Attention after P4
  - [-1, 1, GhostConv, [1024, 3, 2]] # 9-P5/32
  - [-1, 3, C3Ghost, [1024, True]]
  - [-1, 1, ECA, []] # 11 - Efficient Channel Attention after P5
  - [-1, 1, SPPF, [1024, 5]] # 12

# YOLOv8 head with Ghost convolutions
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]] # cat backbone P4 (after ECA)
  - [-1, 3, C3Ghost, [512]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat backbone P3 (after ECA)
  - [-1, 3, C3Ghost, [256]] # 18 (P3/8-small)

  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat head P4
  - [-1, 3, C3Ghost, [512]] # 21 (P4/16-medium)

  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P5
  - [-1, 3, C3Ghost, [1024]] # 24 (P5/32-large)

  - [[18, 21, 24], 1, Detect, [nc]] # Detect(P3, P4, P5)
