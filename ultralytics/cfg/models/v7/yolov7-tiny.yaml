# YOLOv7-tiny object detection model with P3/8 - P5/32 outputs
# Backbone/neck topology (ELAN blocks + MP/SP maxpool routing) transcribed 1:1 from the
# official WongKinYiu/yolov7 cfg/training/yolov7-tiny.yaml (anchor-based IDetect head),
# paired with ultralytics' anchor-free Detect head/loss — same convention already used by
# this repo's yolov5.yaml/yolov6.yaml/yolov9t.yaml so all baselines share one detection head.
# Source: https://github.com/WongKinYiu/yolov7/blob/main/cfg/training/yolov7-tiny.yaml
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
depth_multiple: 1.0 # model depth multiple
width_multiple: 1.0 # layer channel multiple
activation: nn.LeakyReLU(0.1) # yolov7-tiny uses LeakyReLU(0.1) throughout, not SiLU

# YOLOv7-tiny backbone
backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [32, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 1-P2/4

  - [-1, 1, Conv, [32, 1, 1]]
  - [-2, 1, Conv, [32, 1, 1]]
  - [-1, 1, Conv, [32, 3, 1]]
  - [-1, 1, Conv, [32, 3, 1]]
  - [[-1, -2, -3, -4], 1, Concat, [1]]
  - [-1, 1, Conv, [64, 1, 1]] # 7

  - [-1, 1, nn.MaxPool2d, [2, 2, 0]] # 8-P3/8
  - [-1, 1, Conv, [64, 1, 1]]
  - [-2, 1, Conv, [64, 1, 1]]
  - [-1, 1, Conv, [64, 3, 1]]
  - [-1, 1, Conv, [64, 3, 1]]
  - [[-1, -2, -3, -4], 1, Concat, [1]]
  - [-1, 1, Conv, [128, 1, 1]] # 14

  - [-1, 1, nn.MaxPool2d, [2, 2, 0]] # 15-P4/16
  - [-1, 1, Conv, [128, 1, 1]]
  - [-2, 1, Conv, [128, 1, 1]]
  - [-1, 1, Conv, [128, 3, 1]]
  - [-1, 1, Conv, [128, 3, 1]]
  - [[-1, -2, -3, -4], 1, Concat, [1]]
  - [-1, 1, Conv, [256, 1, 1]] # 21

  - [-1, 1, nn.MaxPool2d, [2, 2, 0]] # 22-P5/32
  - [-1, 1, Conv, [256, 1, 1]]
  - [-2, 1, Conv, [256, 1, 1]]
  - [-1, 1, Conv, [256, 3, 1]]
  - [-1, 1, Conv, [256, 3, 1]]
  - [[-1, -2, -3, -4], 1, Concat, [1]]
  - [-1, 1, Conv, [512, 1, 1]] # 28

# YOLOv7-tiny head (PANet with ELAN blocks; SPP-CSPC realized as SP-maxpool concat)
head:
  - [-1, 1, Conv, [256, 1, 1]]
  - [-2, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.MaxPool2d, [5, 1, 2]]
  - [-2, 1, nn.MaxPool2d, [9, 1, 4]]
  - [-3, 1, nn.MaxPool2d, [13, 1, 6]]
  - [[-1, -2, -3, -4], 1, Concat, [1]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [[-1, -7], 1, Concat, [1]]
  - [-1, 1, Conv, [256, 1, 1]] # 37

  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [21, 1, Conv, [128, 1, 1]] # route backbone P4
  - [[-1, -2], 1, Concat, [1]]

  - [-1, 1, Conv, [64, 1, 1]]
  - [-2, 1, Conv, [64, 1, 1]]
  - [-1, 1, Conv, [64, 3, 1]]
  - [-1, 1, Conv, [64, 3, 1]]
  - [[-1, -2, -3, -4], 1, Concat, [1]]
  - [-1, 1, Conv, [128, 1, 1]] # 47

  - [-1, 1, Conv, [64, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [14, 1, Conv, [64, 1, 1]] # route backbone P3
  - [[-1, -2], 1, Concat, [1]]

  - [-1, 1, Conv, [32, 1, 1]]
  - [-2, 1, Conv, [32, 1, 1]]
  - [-1, 1, Conv, [32, 3, 1]]
  - [-1, 1, Conv, [32, 3, 1]]
  - [[-1, -2, -3, -4], 1, Concat, [1]]
  - [-1, 1, Conv, [64, 1, 1]] # 57 (P3/8-small)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 47], 1, Concat, [1]]

  - [-1, 1, Conv, [64, 1, 1]]
  - [-2, 1, Conv, [64, 1, 1]]
  - [-1, 1, Conv, [64, 3, 1]]
  - [-1, 1, Conv, [64, 3, 1]]
  - [[-1, -2, -3, -4], 1, Concat, [1]]
  - [-1, 1, Conv, [128, 1, 1]] # 65 (P4/16-medium)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 37], 1, Concat, [1]]

  - [-1, 1, Conv, [128, 1, 1]]
  - [-2, 1, Conv, [128, 1, 1]]
  - [-1, 1, Conv, [128, 3, 1]]
  - [-1, 1, Conv, [128, 3, 1]]
  - [[-1, -2, -3, -4], 1, Concat, [1]]
  - [-1, 1, Conv, [256, 1, 1]] # 73 (P5/32-large)

  # ponytail: original repo uses RepConv (reparam branches) here; RepConv isn't wired
  # into parse_model's channel-injection path, so plain Conv substitutes — same as
  # every other baseline yaml in this repo uses at this position.
  - [57, 1, Conv, [128, 3, 1]]
  - [65, 1, Conv, [256, 3, 1]]
  - [73, 1, Conv, [512, 3, 1]]

  - [[74, 75, 76], 1, Detect, [nc]] # Detect(P3, P4, P5)
