# YOLO26-SPD-GhostNetV2-CoordAtt-EMA
# SPDConv (space-to-depth, no-stride-loss) downsamplers preserve fine detail for tiny cells,
# CSP-wrapped GhostNetV2 (C2fGhostV2) backbone, and a chained CoordAtt->EMA dual-attention
# gate (positional context first, then multi-scale channel/spatial recalibration) on every
# detection scale.
nc: 80 # number of classes
end2end: True # NMS-free end-to-end detection
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, SPDConv, [128]] # 1-P2/4
  - [-1, 2, C2fGhostV2, [128, True]]
  - [-1, 1, SPDConv, [256]] # 3-P3/8
  - [-1, 2, C2fGhostV2, [256, True]]
  - [-1, 1, SPDConv, [512]] # 5-P4/16
  - [-1, 2, C2fGhostV2, [512, True]]
  - [-1, 1, SPDConv, [1024]] # 7-P5/32
  - [-1, 2, C2fGhostV2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 2, C2fGhostV2, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 2, C2fGhostV2, [256]] # 15 (P3/8-small)
  - [-1, 1, SPDConv, [256]]
  - [[-1, 12], 1, Concat, [1]] # 17 cat head P4
  - [-1, 2, C2fGhostV2, [512]] # 18 (P4/16-medium)
  - [-1, 1, SPDConv, [512]]
  - [[-1, 9], 1, Concat, [1]] # 20 cat head P5
  - [-1, 1, C2fGhostV2, [1024]] # 21 (P5/32-large)
  - [15, 1, CoordAtt, []] # 22 CoordAtt on P3
  - [22, 1, EMA, []] # 23 EMA on P3
  - [18, 1, CoordAtt, []] # 24 CoordAtt on P4
  - [24, 1, EMA, []] # 25 EMA on P4
  - [21, 1, CoordAtt, []] # 26 CoordAtt on P5
  - [26, 1, EMA, []] # 27 EMA on P5
  - [[23, 25, 27], 1, Detect, [nc]] # 28 Detect(P3, P4, P5)
