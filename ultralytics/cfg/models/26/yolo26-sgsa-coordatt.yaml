# YOLO26-SGSA-CoordAtt
# Ports the project's SGSA-YOLO (StarNet+Ghost backbone/neck) onto YOLO26's end2end
# head, with CoordAtt attention heads instead of SSGA to A/B test the two.
nc: 80 # number of classes
end2end: True # NMS-free end-to-end detection
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, GhostConv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C2fStar, [128, True]]
  - [-1, 1, GhostConv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C2fStar, [256, True]]
  - [-1, 1, GhostConv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C2fStar, [512, True]]
  - [-1, 1, GhostConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C2fStar, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 2, C2fGhost, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 2, C2fGhost, [256]] # 15 (P3/8-small)
  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # 17 cat head P4
  - [-1, 2, C2fGhost, [512]] # 18 (P4/16-medium)
  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # 20 cat head P5
  - [-1, 1, C2fGhost, [1024]] # 21 (P5/32-large)
  - [15, 1, CoordAtt, []] # 22 attn on P3
  - [18, 1, CoordAtt, []] # 23 attn on P4
  - [21, 1, CoordAtt, []] # 24 attn on P5
  - [[22, 23, 24], 1, Detect, [nc]] # 25 Detect(P3, P4, P5)
