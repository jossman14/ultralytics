# YOLO26-Hematology-v3 (successor to yolo26-hematology-v2)
# SPDConv stem (fine detail) + C2fMSA multi-scale-attention backbone + GAM_Attention
# bottleneck context + YOLO26's native C2PSA area attention + C2fRes2 neck, with a
# chained SimAM->CoordAtt dual-attention gate (parameter-free saliency first, then
# precise positional encoding) on every detection scale, on the end2end NMS-free head.
nc: 80 # number of classes
end2end: True # NMS-free end-to-end detection
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, SPDConv, [128]] # 1-P2/4
  - [-1, 2, C2fMSA, [128, True]]
  - [-1, 1, SPDConv, [256]] # 3-P3/8
  - [-1, 2, C2fMSA, [256, True]]
  - [-1, 1, SPDConv, [512]] # 5-P4/16
  - [-1, 2, C2fMSA, [512, True]]
  - [-1, 1, SPDConv, [1024]] # 7-P5/32
  - [-1, 2, C2fMSA, [1024, True]]
  - [-1, 1, GAM_Attention, []] # 9 - bottleneck attention/context
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]] # 11 - YOLO26 native area attention

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 13 cat backbone P4
  - [-1, 2, C2fRes2, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 16 cat backbone P3
  - [-1, 2, C2fRes2, [256]] # 17 (P3/8-small)
  - [-1, 1, SPDConv, [256]]
  - [[-1, 14], 1, Concat, [1]] # 19 cat head P4
  - [-1, 2, C2fRes2, [512]] # 20 (P4/16-medium)
  - [-1, 1, SPDConv, [512]]
  - [[-1, 11], 1, Concat, [1]] # 22 cat head P5
  - [-1, 1, C2fRes2, [1024]] # 23 (P5/32-large)
  - [17, 1, SimAM, []] # 24 SimAM on P3
  - [24, 1, CoordAtt, []] # 25 CoordAtt on P3
  - [20, 1, SimAM, []] # 26 SimAM on P4
  - [26, 1, CoordAtt, []] # 27 CoordAtt on P4
  - [23, 1, SimAM, []] # 28 SimAM on P5
  - [28, 1, CoordAtt, []] # 29 CoordAtt on P5
  - [[25, 27, 29], 1, Detect, [nc]] # 30 Detect(P3, P4, P5)
