# YOLO26-SOTA-Fusion-DFL: reg_max/end2end ablation of yolo26-sota-fusion-a.
# Identical backbone+neck (SPDConv stem, Res2Net P2/P3, ConvNeXt P4/P5, native C2PSA,
# CAPFFN neck, SSGA heads) but swaps LEDHead for a standard end2end Detect head with
# reg_max=16 (classic DFL) instead of YOLO26's default reg_max=1. Use this to measure
# whether classic DFL box regression or YOLO26's simplified direct regression wins on
# this dataset, with everything else held fixed.

nc: 80 # number of classes
end2end: True # NMS-free end-to-end detection
reg_max: 16 # DFL bins (classic, vs YOLO26 default of 1 - this is the ablation axis)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2 (stem)
  - [-1, 1, SPDConv, [128]]        # 1-P2/4 (preserve fine details)
  - [-1, 2, C2fRes2, [128, True]]
  - [-1, 1, SPDConv, [256]]        # 3-P3/8
  - [-1, 2, C2fRes2, [256, True]]  # 4 (p3)
  - [-1, 1, SPDConv, [512]]        # 5-P4/16
  - [-1, 2, ConvNeXtBlock, [512]]  # 6 (p4)
  - [-1, 1, SPDConv, [1024]]       # 7-P5/32
  - [-1, 2, ConvNeXtBlock, [1024]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]]         # 10 (sppf) - YOLO26 native area attention

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]      # cat backbone P4
  - [-1, 1, FBM, [512]]            # 13 - FuseBlockMulti
  - [-1, 2, CFCGLU, [512]]         # 14 (neck_p4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # cat backbone P3
  - [-1, 1, FBM, [256]]            # 17 - FuseBlockMulti
  - [-1, 2, CFCGLU, [256]]         # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]     # cat head P4
  - [-1, 2, CFCGLU, [512]]         # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]     # cat head P5
  - [-1, 2, CFCGLU, [1024]]        # 24 (P5/32-large)

  - [18, 1, SSGA, []]              # 25 SSGA on P3
  - [21, 1, SSGA, []]              # 26 SSGA on P4
  - [24, 1, SSGA, []]              # 27 SSGA on P5
  - [[25, 26, 27], 1, Detect, [nc]] # Detect(P3, P4, P5)
