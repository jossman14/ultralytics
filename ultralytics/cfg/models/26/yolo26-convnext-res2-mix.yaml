# YOLO26-ConvNeXt-Res2Net-Mix
# Mixed backbone: Res2Net (C2fRes2) at P2/P3 for hierarchical multi-scale detail on small
# cells, ConvNeXt (C2fConvNeXt) at P4/P5 for large-kernel large-context representation,
# YOLO26's native C2PSA area-attention bottleneck, and parameter-free SimAM heads.
nc: 80 # number of classes
end2end: True # NMS-free end-to-end detection
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C2fRes2, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C2fRes2, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C2fConvNeXt, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C2fConvNeXt, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]] # 10 - YOLO26 native area attention

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C2fConvNeXt, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C2fRes2, [256]] # 16 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # 18 cat head P4
  - [-1, 2, C2fConvNeXt, [512]] # 19 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # 21 cat head P5
  - [-1, 1, C2fConvNeXt, [1024]] # 22 (P5/32-large)
  - [16, 1, SimAM, []] # 23 SimAM on P3
  - [19, 1, SimAM, []] # 24 SimAM on P4
  - [22, 1, SimAM, []] # 25 SimAM on P5
  - [[23, 24, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
