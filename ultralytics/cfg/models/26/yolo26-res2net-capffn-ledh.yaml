# YOLO26-Res2Net-CAPFFN-LEDHead
# SCL-family variant on YOLO26: Res2Net multi-scale backbone + CAPFFN neck
# (PCE/FBM/CFCGLU) + LEDHead lightweight detection head (non-end2end).
nc: 80 # number of classes
reg_max: 16 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C2fRes2, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C2fRes2, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C2fRes2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C2fRes2, [1024, True]]
  - [-1, 1, PCE, [1024]] # 9 - bottleneck attention/context
  - [-1, 1, SPPF, [1024, 5, 3, True]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 1, FBM, [512]] # 13 - FuseBlockMulti
  - [-1, 2, CFCGLU, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 16 cat backbone P3
  - [-1, 1, FBM, [256]] # 17 - FuseBlockMulti
  - [-1, 2, CFCGLU, [256]] # 18 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # 20 cat head P4
  - [-1, 2, CFCGLU, [512]] # 21 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # 23 cat head P5
  - [-1, 2, CFCGLU, [1024]] # 24 (P5/32-large)
  - [[18, 21, 24], 1, LEDHead, [nc]] # 25 LEDHead(P3, P4, P5)
