# YOLO26-SOTA-Fusion-B: lightweight-hybrid flagship candidate, YOLO26 successor to
# yolov8-sota-fusion-b.
# Backbone: StarNet (C2fStar) at P2/P3 for cheap star-operation feature reuse, GhostNetV2
#   (GhostBottleneckV2: ghost conv + DFC long-range attention) at P4/P5, then YOLO26's
#   native C2PSA area attention.
# Neck: Swin Transformer blocks (C2fSwin) for shifted-window global context during fusion.
# Heads: chained CoordAtt -> NonLocalBlock (position-aware gate followed by full
#   self-attention) on every detection scale, on YOLO26's end2end NMS-free Detect head.

nc: 80 # number of classes
end2end: True # NMS-free end-to-end detection
reg_max: 1 # DFL bins (YOLO26 default: direct box regression, no DFL integral)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2 (stem)
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 2, C2fStar, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 2, C2fStar, [256, True]]          # 4 (p3)
  - [-1, 1, GhostConv, [512, 3, 2]]        # 5-P4/16
  - [-1, 2, GhostBottleneckV2, [512]]      # 6 (p4)
  - [-1, 1, GhostConv, [1024, 3, 2]]       # 7-P5/32
  - [-1, 2, GhostBottleneckV2, [1024]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]      # 9
  - [-1, 2, C2PSA, [1024]]                 # 10 (sppf) - YOLO26 native area attention

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]              # cat backbone P4
  - [-1, 2, C2fSwin, [512, True]]          # 12 (neck_p4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]              # cat backbone P3
  - [-1, 2, C2fSwin, [256, True]]          # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]             # cat head P4
  - [-1, 2, C2fSwin, [512, True]]          # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]             # cat head P5
  - [-1, 1, C2fSwin, [1024, True]]         # 21 (P5/32-large)

  - [15, 1, CoordAtt, []]                  # 22
  - [-1, 1, NonLocalBlock, []]             # 23 - P3 out
  - [18, 1, CoordAtt, []]                  # 24
  - [-1, 1, NonLocalBlock, []]             # 25 - P4 out
  - [21, 1, CoordAtt, []]                  # 26
  - [-1, 1, NonLocalBlock, []]             # 27 - P5 out
  - [[23, 25, 27], 1, Detect, [nc]]        # Detect(P3, P4, P5)
