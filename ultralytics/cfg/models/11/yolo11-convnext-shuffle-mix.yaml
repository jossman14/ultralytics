# YOLO11-ConvNeXt-Shuffle-Mix
# Hybrid backbone: ConvNeXt (C2fConvNeXt, large-kernel depthwise + inverted-MLP) blocks at
# the P2/P3 stages, and C2fShuffle (channel-split + depthwise + channel-shuffle) blocks at
# the deeper P4/P5 stages, with a NonLocalBlock inserted after the last backbone stage
# (before SPPF) to capture global dependencies between distant but morphologically similar
# cells, followed by YOLO11's native C2PSA bottleneck, native C3k2 neck, and Efficient
# Channel Attention (ECA) on all three detection scales.

nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C2fConvNeXt, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C2fConvNeXt, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C2fShuffle, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C2fShuffle, [1024, True]]
  - [-1, 1, NonLocalBlock, []] # 9 - global context before SPPF
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  - [17, 1, ECA, []] # 24 attn on P3
  - [20, 1, ECA, []] # 25 attn on P4
  - [23, 1, ECA, []] # 26 attn on P5

  - [[24, 25, 26], 1, Detect, [nc]] # 27 Detect(P3, P4, P5)
