# YOLO11-SPD-Shuffle-CoordAtt
# SPDConv (space-to-depth) downsamplers replace strided convolutions throughout the
# network to preserve fine spatial detail for tiny objects (platelets, ring-stage
# parasites), combined with a C2fShuffle (channel-split + depthwise + channel-shuffle)
# backbone, YOLO11's native C2PSA bottleneck, and Coordinate Attention on all three
# detection scales for precise small-cell localization.

nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, SPDConv, [128]] # 1-P2/4
  - [-1, 2, C2fShuffle, [256, True]]
  - [-1, 1, SPDConv, [256]] # 3-P3/8
  - [-1, 2, C2fShuffle, [512, True]]
  - [-1, 1, SPDConv, [512]] # 5-P4/16
  - [-1, 2, C2fShuffle, [512, True]]
  - [-1, 1, SPDConv, [1024]] # 7-P5/32
  - [-1, 2, C2fShuffle, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, SPDConv, [256]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, SPDConv, [512]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [16, 1, CoordAtt, []] # 23 attn on P3
  - [19, 1, CoordAtt, []] # 24 attn on P4
  - [22, 1, CoordAtt, []] # 25 attn on P5

  - [[23, 24, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
