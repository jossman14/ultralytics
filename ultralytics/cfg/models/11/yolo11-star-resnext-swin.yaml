# YOLO11-Star-ResNeXt-Swin
# Hybrid backbone: StarNet (C2fStar) star-connection blocks at the P2/P3 stages (cheap,
# high-resolution feature extraction) and ResNeXt (C2fResNeXt) cardinality-grouped
# residual bottlenecks at the deeper P4/P5 stages, with YOLO11's native C2PSA bottleneck.
# A Swin Transformer (C2fSwin, shifted-window attention) neck replaces the native C3k2
# neck for global cross-window context during multi-scale fusion, plus EMA on all three
# detection scales.

nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C2fStar, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C2fStar, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C2fResNeXt, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C2fResNeXt, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C2fSwin, [512]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C2fSwin, [256]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C2fSwin, [512]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C2fSwin, [1024]] # 22 (P5/32-large)

  - [16, 1, EMA, []] # 23 attn on P3
  - [19, 1, EMA, []] # 24 attn on P4
  - [22, 1, EMA, []] # 25 attn on P5

  - [[23, 24, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
