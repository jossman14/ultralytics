# YOLO11-Hematology
# SPDConv (space-to-depth) downsamplers for fine detail preservation + C2fMSA (C2f with
# PSABlock multi-scale attention) backbone + GAM_Attention bottleneck context right before
# SPPF + YOLO11's native C2PSA area attention + C2fRes2 neck for hierarchical multi-scale
# fusion + Coordinate Attention on all three detection scales. Aimed at blood-cell /
# leukemia small-object detection.

nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, SPDConv, [128]] # 1-P2/4
  - [-1, 2, C2fMSA, [256, True]]
  - [-1, 1, SPDConv, [256]] # 3-P3/8
  - [-1, 2, C2fMSA, [512, True]]
  - [-1, 1, SPDConv, [512]] # 5-P4/16
  - [-1, 2, C2fMSA, [512, True]]
  - [-1, 1, SPDConv, [1024]] # 7-P5/32
  - [-1, 2, C2fMSA, [1024, True]]
  - [-1, 1, GAM_Attention, []] # 9 - bottleneck attention/context
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C2fRes2, [512]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C2fRes2, [256]] # 17 (P3/8-small)

  - [-1, 1, SPDConv, [256]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C2fRes2, [512]] # 20 (P4/16-medium)

  - [-1, 1, SPDConv, [512]]
  - [[-1, 11], 1, Concat, [1]] # cat head P5
  - [-1, 2, C2fRes2, [1024]] # 23 (P5/32-large)

  - [17, 1, CoordAtt, []] # 24 attn on P3
  - [20, 1, CoordAtt, []] # 25 attn on P4
  - [23, 1, CoordAtt, []] # 26 attn on P5

  - [[24, 25, 26], 1, Detect, [nc]] # 27 Detect(P3, P4, P5)
