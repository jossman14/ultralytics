# YOLO12-Ghost-GAM: Lightweight YOLO12 variant with GhostNet modules and Global Attention Mechanism
# Optimized for edge device deployment with reduced parameters and FLOPs
# References:
#   - GhostNet: https://arxiv.org/abs/1911.11907
#   - GAM: https://arxiv.org/abs/2112.05561
#   - YOLO12: https://docs.ultralytics.com/models/yolo12

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # YOLO12n-ghost-gam
  s: [0.50, 0.50, 1024] # YOLO12s-ghost-gam
  m: [0.50, 1.00, 512] # YOLO12m-ghost-gam
  l: [1.00, 1.00, 512] # YOLO12l-ghost-gam
  x: [1.00, 1.50, 512] # YOLO12x-ghost-gam

# YOLO12-Ghost-GAM backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem layer, keep standard conv for stability)
  - [-1, 1, GhostConv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C2fGhost, [128, True]]
  - [-1, 1, GhostConv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C2fGhost, [256, True]]
  - [-1, 1, GhostConv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, C2fGhost, [512, True]]
  - [-1, 1, GhostConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, C2fGhost, [1024, True]]
  - [-1, 1, GAM_Attention, []] # 9-GAM at backbone end for global context
  - [-1, 1, SPPF, [1024, 5]] # 10

# YOLO12-Ghost-GAM head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C2fGhost, [512]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C2fGhost, [256]] # 16 (P3/8-small)

  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C2fGhost, [512]] # 19 (P4/16-medium)

  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C2fGhost, [1024]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
