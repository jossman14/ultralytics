# YOLOv8-GhostNetV2-SPD-GAM
# SPDConv stem/downsampling (preserves fine detail for tiny cells/parasites) +
# GhostNetV2 backbone + GAM_Attention at the P5 bottleneck for global context.
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, SPDConv, [128]] # 1-P2/4
  - [-1, 3, GhostBottleneckV2, [128]]
  - [-1, 1, SPDConv, [256]] # 3-P3/8
  - [-1, 6, GhostBottleneckV2, [256]]
  - [-1, 1, SPDConv, [512]] # 5-P4/16
  - [-1, 6, GhostBottleneckV2, [512]]
  - [-1, 1, SPDConv, [1024]] # 7-P5/32
  - [-1, 3, GhostBottleneckV2, [1024]]
  - [-1, 1, GAM_Attention, []] # 9 - bottleneck attention/context
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 3, GhostBottleneckV2, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 3, GhostBottleneckV2, [256]] # 16 (P3/8-small)
  - [-1, 1, SPDConv, [256]]
  - [[-1, 13], 1, Concat, [1]] # 18 cat head P4
  - [-1, 3, GhostBottleneckV2, [512]] # 19 (P4/16-medium)
  - [-1, 1, SPDConv, [512]]
  - [[-1, 10], 1, Concat, [1]] # 21 cat head P5
  - [-1, 3, GhostBottleneckV2, [1024]] # 22 (P5/32-large)
  - [[16, 19, 22], 1, Detect, [nc]] # 23 Detect(P3, P4, P5)
