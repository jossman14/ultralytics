# YOLOv8-Hematology-v2: successor to yolov8-hematology.yaml.
# Same SPDConv + C2fMSA + GAM_Attention backbone (preserves fine detail, multi-scale attention),
# but the neck's plain C2f blocks are upgraded to C2fRes2 (Res2Net hierarchical multi-scale
# residuals) and every detection scale gets a CoordAtt gate for precise cell localization.

nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n-hematology-v2
  s: [0.33, 0.50, 1024] # YOLOv8s-hematology-v2
  m: [0.67, 0.75, 768]  # YOLOv8m-hematology-v2
  l: [1.00, 1.00, 512]  # YOLOv8l-hematology-v2
  x: [1.00, 1.25, 512]  # YOLOv8x-hematology-v2

# YOLOv8-Hematology-v2 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2 (stem layer)
  - [-1, 1, SPDConv, [128]]        # 1-P2/4 (preserve fine details)
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, SPDConv, [256]]        # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SPDConv, [512]]        # 5-P4/16
  - [-1, 6, C2fMSA, [512, True]]   # 6-Multi-scale attention for medium cells
  - [-1, 1, SPDConv, [1024]]       # 7-P5/32
  - [-1, 3, C2fMSA, [1024, True]]  # 8-Multi-scale attention for large cells
  - [-1, 1, GAM_Attention, []]     # 9-Global attention for context
  - [-1, 1, SPPF, [1024, 5]]       # 10

# YOLOv8-Hematology-v2 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]      # cat backbone P4
  - [-1, 3, C2fMSA, [512]]         # 13-attention for medium objects

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # cat backbone P3
  - [-1, 3, C2fRes2, [256]]        # 16 (P3/8-small cells: platelets, parasites)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]     # cat head P4
  - [-1, 3, C2fMSA, [512]]         # 19 (P4/16-medium cells: RBC, lymphocytes)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]     # cat head P5
  - [-1, 3, C2fRes2, [1024]]       # 22 (P5/32-large cells: monocytes, WBC)

  - [16, 1, CoordAtt, []]          # 23 CoordAtt on P3
  - [19, 1, CoordAtt, []]          # 24 CoordAtt on P4
  - [22, 1, CoordAtt, []]          # 25 CoordAtt on P5
  - [[23, 24, 25], 1, Detect, [nc]] # Detect(P3, P4, P5)
