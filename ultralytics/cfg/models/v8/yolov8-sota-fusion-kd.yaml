# YOLOv8-SOTA-Fusion-KD: Knowledge Distillation student, architecturally identical to
# yolov8-sota-fusion-a (same backbone/neck/head) so it can train standalone or as a KD
# student distilling from a larger teacher scale (see main.py KD_CONFIG for the
# "yolov8s-sota-fusion-kd" -> "v8/yolov8l-sota-fusion-a.yaml" pairing).
# Backbone: SPDConv stem (preserve fine detail for tiny cells) + Res2Net (C2fRes2) at
#   P2/P3 for hierarchical multi-scale features on small/medium cells, then ConvNeXt blocks
#   at P4/P5 for large-kernel, large-context representation on bigger cells.
# Neck: CAPFFN (PCE + FBM + CFCGLU), reused from this project's proven SCL/CAPFFN family.
# Heads: SSGA (Scale-Sensitive Gated Attention) on every scale + LEDHead lightweight output.

nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2 (stem)
  - [-1, 1, SPDConv, [128]]        # 1-P2/4 (preserve fine details)
  - [-1, 3, C2fRes2, [128, True]]
  - [-1, 1, SPDConv, [256]]        # 3-P3/8
  - [-1, 6, C2fRes2, [256, True]]  # 4 (p3)
  - [-1, 1, SPDConv, [512]]        # 5-P4/16
  - [-1, 6, ConvNeXtBlock, [512]]  # 6 (p4)
  - [-1, 1, SPDConv, [1024]]       # 7-P5/32
  - [-1, 3, ConvNeXtBlock, [1024]]
  - [-1, 1, PCE, [1024]]           # 9 - Pyramid Context Extraction
  - [-1, 1, SPPF, [1024, 5]]       # 10 (sppf)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]      # cat backbone P4
  - [-1, 1, FBM, [512]]            # 13 - FuseBlockMulti
  - [-1, 3, CFCGLU, [512]]         # 14 (neck_p4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # cat backbone P3
  - [-1, 1, FBM, [256]]            # 17 - FuseBlockMulti
  - [-1, 3, CFCGLU, [256]]         # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]     # cat head P4
  - [-1, 3, CFCGLU, [512]]         # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]     # cat head P5
  - [-1, 3, CFCGLU, [1024]]        # 24 (P5/32-large)

  - [18, 1, SSGA, []]              # 25 SSGA on P3
  - [21, 1, SSGA, []]              # 26 SSGA on P4
  - [24, 1, SSGA, []]              # 27 SSGA on P5
  - [[25, 26, 27], 1, LEDHead, [nc]] # LEDHead(P3, P4, P5)
