# YOLOv8-SPD-Shuffle-SimAM
# SPDConv (space-to-depth) downsamplers preserve fine-grained spatial detail for tiny cells
# (platelets, parasites) instead of lossy strided convs, feeding a C2fShuffle (channel-shuffle)
# backbone for cheap cross-group feature mixing. SimAM (parameter-free 3D attention) gates
# every detection scale.
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, SPDConv, [128]] # 1-P2/4 (preserve fine details)
  - [-1, 3, C2fShuffle, [128, True]]
  - [-1, 1, SPDConv, [256]] # 3-P3/8
  - [-1, 6, C2fShuffle, [256, True]]
  - [-1, 1, SPDConv, [512]] # 5-P4/16
  - [-1, 6, C2fShuffle, [512, True]]
  - [-1, 1, SPDConv, [1024]] # 7-P5/32
  - [-1, 3, C2fShuffle, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # 17 cat head P4
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # 20 cat head P5
  - [-1, 3, C2f, [1024]] # 21 (P5/32-large)
  - [15, 1, SimAM, []] # 22 SimAM on P3
  - [18, 1, SimAM, []] # 23 SimAM on P4
  - [21, 1, SimAM, []] # 24 SimAM on P5
  - [[22, 23, 24], 1, Detect, [nc]] # 25 Detect(P3, P4, P5)
