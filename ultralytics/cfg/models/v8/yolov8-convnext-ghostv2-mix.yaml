# YOLOv8-ConvNeXt-GhostV2-Mix
# Hybrid backbone: C2fConvNeXt (large-kernel depthwise conv + inverted MLP) at P2/P3 for
# rich early representation, switching to C2fGhostV2 (ghost conv + DFC attention) at
# P4/P5 for efficiency on deeper, more expensive stages. A NonLocalBlock is inserted right
# before SPPF for global context, and CoordAtt gates every detection scale.
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2fConvNeXt, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2fConvNeXt, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2fGhostV2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2fGhostV2, [1024, True]]
  - [-1, 1, NonLocalBlock, []] # 9 - global context before SPPF
  - [-1, 1, SPPF, [1024, 5]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 3, C2f, [256]] # 16 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # 18 cat head P4
  - [-1, 3, C2f, [512]] # 19 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # 21 cat head P5
  - [-1, 3, C2f, [1024]] # 22 (P5/32-large)
  - [16, 1, CoordAtt, []] # 23 CoordAtt on P3
  - [19, 1, CoordAtt, []] # 24 CoordAtt on P4
  - [22, 1, CoordAtt, []] # 25 CoordAtt on P5
  - [[23, 24, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
