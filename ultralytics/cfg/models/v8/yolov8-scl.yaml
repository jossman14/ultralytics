# YOLOv8s-SCL: Complete SCL-YOLO implementation
# S = StarNet backbone (C2fStar)
# C = CAPFFN neck (PCE, FBM, CFCGLU)
# L = LEDHead (Lightweight Efficient Detection Head)
# Reference: SCL-YOLO paper for blood cell detection on edge devices

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# StarNet backbone with C2fStar blocks
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2fStar, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2fStar, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2fStar, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2fStar, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, PCE, [1024]] # 10 - Pyramid Context Extraction

# CAPFFN neck with FBM and CFCGLU + LEDHead
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 1, FBM, [512]] # 13 - FuseBlockMulti
  - [-1, 3, CFCGLU, [512]] # 14 - CFCGLU block

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, FBM, [256]] # 17 - FuseBlockMulti
  - [-1, 3, CFCGLU, [256]] # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 3, CFCGLU, [512]] # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 3, CFCGLU, [1024]] # 24 (P5/32-large)

  - [[18, 21, 24], 1, LEDHead, [nc]] # LEDHead(P3, P4, P5)
