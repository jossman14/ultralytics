# SGSA-YOLO (PROPOSED): StarGhost lightweight backbone/neck + Scale-Sensitive Gated Attention.
# Full proposed model for online-gambling (judol) logo detection.
#   - StarNet C2fStar backbone + Ghost neck  -> lightweight (fewer params/GFLOPs)
#   - SSGA at each detection scale           -> scale-sensitive small-logo attention

nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (standard stem)
  - [-1, 1, GhostConv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2fStar, [128, True]]
  - [-1, 1, GhostConv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2fStar, [256, True]]
  - [-1, 1, GhostConv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2fStar, [512, True]]
  - [-1, 1, GhostConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2fStar, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2fGhost, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2fGhost, [256]] # 15 (P3/8-small)

  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2fGhost, [512]] # 18 (P4/16-medium)

  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2fGhost, [1024]] # 21 (P5/32-large)

  - [15, 1, ECA, []] # 22 ECA on P3
  - [18, 1, ECA, []] # 23 ECA on P4
  - [21, 1, ECA, []] # 24 ECA on P5
  - [[22, 23, 24], 1, Detect, [nc]] # Detect(P3, P4, P5)
