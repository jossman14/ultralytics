# YOLOv8-Swin: YOLOv8 with Swin Transformer backbone
# Combines Swin Transformer's shifted window attention with YOLO detection
# 
# Key Features:
#   - C2fSwin: C2f blocks using Swin Transformer attention
#   - Shifted window attention for efficient global context
#   - Relative position encoding for spatial awareness
#
# References:
#   - Swin Transformer: https://arxiv.org/abs/2103.14030

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n-Swin
  s: [0.33, 0.50, 1024] # YOLOv8s-Swin (~11M params)
  m: [0.67, 0.75, 768]  # YOLOv8m-Swin
  l: [1.00, 1.00, 512]  # YOLOv8l-Swin
  x: [1.00, 1.25, 512]  # YOLOv8x-Swin

# YOLOv8-Swin backbone with Swin Transformer blocks
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2 (stem)
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4
  - [-1, 3, C2fSwin, [128, True]]     # 2 - Swin attention block
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 6, C2fSwin, [256, True]]     # 4 - Swin attention block
  - [-1, 1, Conv, [512, 3, 2]]        # 5-P4/16
  - [-1, 6, C2fSwin, [512, True]]     # 6 - Swin attention block
  - [-1, 1, Conv, [1024, 3, 2]]       # 7-P5/32
  - [-1, 3, C2fSwin, [1024, True]]    # 8 - Swin attention block
  - [-1, 1, SPPF, [1024, 5]]          # 9

# YOLOv8-Swin head (standard FPN)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]         # cat backbone P4
  - [-1, 3, C2f, [512]]               # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]         # cat backbone P3
  - [-1, 3, C2f, [256]]               # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]        # cat head P4
  - [-1, 3, C2f, [512]]               # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]         # cat head P5
  - [-1, 3, C2f, [1024]]              # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]   # Detect(P3, P4, P5)
