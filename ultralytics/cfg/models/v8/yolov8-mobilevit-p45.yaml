# YOLOv8-MobileViT-P45
# Cheap C2f stages at P2/P3 preserve fine detail for small cells at low cost; P4/P5 stages
# switch to MobileViTBlock (local conv encoding + patch-wise Transformer global context) to
# inject long-range dependencies for larger cells/clusters. CoordAtt gates every detection
# scale for precise cell localization.
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4 (P3)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, MobileViTBlock, [512]] # 6 (P4) - local+global conv-transformer hybrid
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, MobileViTBlock, [1024]] # 8 (P5)
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # 17 cat head P4
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # 20 cat head P5
  - [-1, 3, C2f, [1024]] # 21 (P5/32-large)
  - [15, 1, CoordAtt, []] # 22 CoordAtt on P3
  - [18, 1, CoordAtt, []] # 23 CoordAtt on P4
  - [21, 1, CoordAtt, []] # 24 CoordAtt on P5
  - [[22, 23, 24], 1, Detect, [nc]] # 25 Detect(P3, P4, P5)
